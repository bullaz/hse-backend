spring.application.name=hse

spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=true
spring.flyway.default-schema=hse_schema
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

spring.datasource.url=jdbc:postgresql://localhost:5432/hse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=hse_schema


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.jackson.serialization.write-dates-as-timestamps=false

spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET}
frontend.url=${FRONTEND_URL:http://localhost:5173}
cookie.secure=${COOKIE_SECURE:false}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

#server.address=0.0.0.0

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
hse.mail.from=${MAIL_FROM:andersonmahosi@gmail.com}
hse.mail.from.name=${MAIL_FROM_NAME:Département HSE Stellarix}
hse.mail.phone=${MAIL_PHONE:+261 00 00 000 00}

ppe.models.det=${PPE_DET_MODEL:models/det.onnx}
ppe.models.glasses=${PPE_GLASSES_MODEL:models/glasses.onnx}
ppe.models.shoes=${PPE_SHOES_MODEL:D:/STG/livrables_de_projet/raw/other-shoes-model/v2/effnet_bce_binary_safety_shoes.onnx}


